name: Gemini Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Code Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          # Limit diff size to avoid hitting token limits
          head -c 8000 pr_diff.txt > compact_diff.txt

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Load the diff into a variable
          DIFF_CONTENT=$(cat compact_diff.txt)

          # 2. Define the instruction
          PROMPT_TEXT="Review this React code diff for logic errors and state management bugs. Provide a concise bulleted list. If no issues, say LGTM. DIFF: $DIFF_CONTENT"

          # 3. Use jq to build a valid JSON payload (prevents escaping issues)
          PAYLOAD=$(jq -n --arg msg "$PROMPT_TEXT" '{contents: [{parts: [{text: $msg}]}]}')

          # 4. Call the API
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" > response.json

          # 5. Extract text or log the error if the candidate is missing
          if jq -e '.candidates[0].content.parts[0].text' response.json > /dev/null; then
            jq -r '.candidates[0].content.parts[0].text' response.json > review_comment.txt
          else
            echo "❌ ERROR: Gemini API returned an error or safety block."
            echo "Full Response below:"
            cat response.json
            echo "Error: Gemini was unable to generate a review. Check the GitHub Action logs for details." > review_comment.txt
          fi

      - name: Post Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: review_comment.txt
