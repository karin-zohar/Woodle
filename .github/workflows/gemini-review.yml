name: Gemini Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Google Gemini Code Review
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-1.5-flash"
          # We use a raw prompt to avoid the deprecated --prompt flag issue
          prompt: |
            Identify and review the code changes in this PR.
            You MUST output ONLY a JSON array. No text before or after.

            Format: [{"path": "string", "line": number, "body": "string"}]

            Review for:
            1. React 'Derived State' vs manual board updates.
            2. Logic bugs in Wordle (double-letters).
            3. Hardcoded constants.
