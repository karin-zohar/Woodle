name: Gemini Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Google Gemini Code Review
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-1.5-flash"
          # We place the instruction directly as the prompt.
          # Note: No 'prompt:' label here because we want it as a positional argument.
          # The CLI will now interpret this string as the main command.
          args: >
            "/review 
            Review the code changes. 
            Output ONLY a JSON array: [{\"path\": \"string\", \"line\": number, \"body\": \"string\"}].
            Focus on React 'Derived State' vs manual board updates and double-letter logic."
