name: Gemini Reviewer

on:
  issue_comment:
    types: [created]

jobs:
  gemini-review:
    # This filter ensures the job ONLY runs if the comment contains the trigger
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # Needed to add reactions to comments

    steps:
      - name: Acknowledge Request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Check out the PR branch specifically
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Get Code Diff
        id: diff
        run: |
          git fetch origin ${{ github.event.issue.pull_request.base.ref }}
          git diff origin/${{ github.event.issue.pull_request.base.ref }}...HEAD > pr_diff.txt
          head -c 10000 pr_diff.txt > compact_diff.txt

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF_CONTENT=$(cat compact_diff.txt)
          PROMPT_TEXT="Review this React code diff for logic errors and state management bugs. Provide a concise bulleted list. If no issues, say LGTM. DIFF: $DIFF_CONTENT"

          PAYLOAD=$(jq -n --arg msg "$PROMPT_TEXT" '{
            contents: [{parts: [{text: $msg}]}],
            safetySettings: [
              {category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_ONLY_HIGH"}
            ]
          }')

          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" > response.json

          if jq -e '.candidates[0].content.parts[0].text' response.json > /dev/null; then
            echo "### 🤖 Gemini Code Review" > review_comment.txt
            jq -r '.candidates[0].content.parts[0].text' response.json >> review_comment.txt
          else
            echo "### 🤖 Gemini Reviewer Notice" > review_comment.txt
            ERROR_MSG=$(jq -r '.error.message // .candidates[0].finishReason // "Unknown API Error"' response.json)
            echo "Could not generate review. Reason: **$ERROR_MSG**" >> review_comment.txt
          fi

      - name: Post Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: review_comment.txt
          pr_number: ${{ github.event.issue.number }}
