name: Gemini Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Code Diff
        id: diff
        run: |
          # Fetch the base branch to compare against
          git fetch origin ${{ github.base_ref }}
          # Generate the diff and limit to the first 10,000 characters to prevent payload bloat
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          head -c 10000 pr_diff.txt > compact_diff.txt

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Prepare the prompt and diff content
          DIFF_CONTENT=$(cat compact_diff.txt)
          PROMPT_TEXT="Review this React code diff for logic errors and state management bugs. Provide a concise bulleted list. If no issues, say LGTM. DIFF: $DIFF_CONTENT"

          # 2. Use jq to build a safe JSON payload with safety settings
          # We use gemini-2.0-flash as it is the current standard for v1beta
          PAYLOAD=$(jq -n --arg msg "$PROMPT_TEXT" '{
            contents: [{parts: [{text: $msg}]}],
            safetySettings: [
              {category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_ONLY_HIGH"}
            ]
          }')

          # 3. Call the Gemini API
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" > response.json

          # 4. Process the response
          if jq -e '.candidates[0].content.parts[0].text' response.json > /dev/null; then
            jq -r '.candidates[0].content.parts[0].text' response.json > review_comment.txt
          else
            echo "❌ API Error Detected"
            cat response.json
            
            # Extract error message or finish reason (like SAFETY or QUOTA)
            ERROR_MSG=$(jq -r '.error.message // .candidates[0].finishReason // "Unknown API Error"' response.json)
            echo "### 🤖 Gemini Reviewer Notice" > review_comment.txt
            echo "Could not generate review. Reason: **$ERROR_MSG**" >> review_comment.txt
            echo "Please check the [GitHub Action logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the full JSON response." >> review_comment.txt
          fi

      - name: Post Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: review_comment.txt
