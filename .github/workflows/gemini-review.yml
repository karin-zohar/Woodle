name: Gemini Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Code Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          head -c 8000 pr_diff.txt > compact_diff.txt

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF_CONTENT=$(cat compact_diff.txt)
          PROMPT_TEXT="Review this React code diff for logic errors and state management bugs. Provide a concise bulleted list. If no issues, say LGTM. DIFF: $DIFF_CONTENT"

          # 1. Build Payload with Safety Settings set to BLOCK_ONLY_HIGH
          # This prevents the "Safety Block" that often triggers on code snippets.
          PAYLOAD=$(jq -n --arg msg "$PROMPT_TEXT" '{
            contents: [{parts: [{text: $msg}]}],
            safetySettings: [
              {category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_ONLY_HIGH"},
              {category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_ONLY_HIGH"}
            ]
          }')

          # 2. Call the API
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" > response.json

          # 3. Check for valid response
          if jq -e '.candidates[0].content.parts[0].text' response.json > /dev/null; then
            jq -r '.candidates[0].content.parts[0].text' response.json > review_comment.txt
          else
            echo "❌ API Failure. Check full response below:"
            cat response.json
            
            # Extract specific error message if available
            ERROR_MSG=$(jq -r '.error.message // .candidates[0].finishReason // "Unknown Error"' response.json)
            echo "Gemini Error: $ERROR_MSG. Check Action logs for full JSON." > review_comment.txt
          fi

      - name: Post Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: review_comment.txt
