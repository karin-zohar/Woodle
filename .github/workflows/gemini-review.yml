name: Gemini Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Google Gemini Code Review
        uses: google-github-actions/run-gemini-cli@v0 # <--- Use this official path
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-1.5-flash"
          # The official action uses a slightly different command structure for PR reviews
          command: "/review"
          instructions: |
            You are a Senior React Developer. Focus on:
            1. Using Derived State instead of manual board updates.
            2. Logic bugs (double-letter counts).
            3. React performance and hardcoded constants.
