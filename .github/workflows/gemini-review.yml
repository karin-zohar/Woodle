- name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Sanitize the diff: remove quotes and backslashes that break JSON
          CLEAN_DIFF=$(cat compact_diff.txt | jq -Rs .)

          # Call the API directly
          curl https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }} \
              -H 'Content-Type: application/json' \
              -X POST \
              -d "{
                \"contents\": [{
                  \"parts\":[{
                    \"text\": \"Review these React code changes. Provide a bulleted list of logic or state issues. If it looks good, say LGTM. DIFF: $CLEAN_DIFF\"
                  }]
                }]
              }" > response.json
          
          # Debug: Show the response in logs so we can see errors
          cat response.json

      - name: Post Comment
        run: |
          # Extract the text and handle potential nulls
          # This looks for the specific path in the Gemini JSON response
          MESSAGE=$(jq -r '.candidates[0].content.parts[0].text // "AI could not generate a review (Quota or Safety filter hit)."' response.json)
          echo "$MESSAGE" > review_comment.txt

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: review_comment.txt